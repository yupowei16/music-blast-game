<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>末日倖存者：Roguelike 割草大戰</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0d15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }

        #gameCanvas {
            display: block;
            background: #111;
        }

        /* UI 頂部狀態列 */
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stats-group {
            display: flex;
            gap: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 血量與護盾條 */
        .bars-container {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .bar-wrapper {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 7px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.1s linear;
        }

        #hp-bar { background: linear-gradient(90deg, #ff3366, #ff6688); }
        #shield-bar { background: linear-gradient(90deg, #00d2ff, #0088ff); }

        /* 經驗值條 */
        .xp-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        #xp-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffcc, #00ff66);
            transition: width 0.2s ease;
        }

        /* 技能/衝刺狀態 */
        .skills-status {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .cooldown-badge {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-bar {
            width: 60px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .mini-bar-fill { height: 100%; width: 100%; background: #00ffcc; }

        /* BOSS 血條 */
        #boss-hp-container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 600px;
            display: none;
            text-align: center;
        }

        #boss-hp-bar-bg {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff0055;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        #boss-hp-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff0055, #ff5500);
            transition: width 0.1s linear;
        }

        /* 彈出視窗浮層 */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: #181828;
            border: 2px solid #3d3d66;
            border-radius: 16px;
            padding: 30px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            text-align: center;
        }

        .modal-title {
            font-size: 28px;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* 選項卡片 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .option-card {
            background: #222238;
            border: 2px solid #444466;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .option-card:hover {
            transform: translateY(-5px);
            border-color: #00ffcc;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.3);
            background: #2a2a48;
        }

        .option-icon { font-size: 40px; }
        .option-name { font-size: 18px; font-weight: bold; color: #fff; }
        .option-desc { font-size: 13px; color: #aaa; line-height: 1.4; }

        /* 按鈕樣式 */
        .btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            color: white;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }

        /* 商店條目 */
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222238;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* 統計圖表項目 */
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            font-size: 14px;
        }
        .stat-bar-bg {
            flex-grow: 1;
            height: 12px;
            background: #333;
            margin: 0 15px;
            border-radius: 6px;
            overflow: hidden;
        }
        .stat-bar-val { height: 100%; background: #ffaa00; width: 0%; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-container">
        <div class="top-row">
            <div class="bars-container">
                <div class="bar-wrapper"><div id="hp-bar" class="bar-fill"></div></div>
                <div class="bar-wrapper"><div id="shield-bar" class="bar-fill"></div></div>
            </div>
            <div class="stats-group">
                <div class="stat-item">⏱️ <span id="time-text">00:00</span></div>
                <div class="stat-item">💀 <span id="score-text">0</span></div>
                <div class="stat-item">💰 <span id="gold-text">0</span></div>
                <div class="stat-item">⭐ Lv.<span id="level-text">1</span></div>
            </div>
        </div>

        <div class="xp-bar-container">
            <div id="xp-bar"></div>
        </div>

        <div class="skills-status">
            <div class="cooldown-badge">
                <span id="dash-text">衝刺 [Shift]</span>
                <div class="mini-bar"><div id="dash-bar" class="mini-bar-fill"></div></div>
            </div>
            <div class="cooldown-badge">
                <span id="ult-text">必殺技 [Q]</span>
                <div class="mini-bar"><div id="ult-bar" class="mini-bar-fill" style="background: #ff0055;"></div></div>
            </div>
        </div>
    </div>

    <!-- BOSS 血條 -->
    <div id="boss-hp-container">
        <h3 style="color: #ff0055; text-shadow: 0 0 5px #ff0055;">⚠️ 領主出現 ⚠️</h3>
        <div id="boss-hp-bar-bg">
            <div id="boss-hp-bar"></div>
        </div>
    </div>

    <!-- 開始與角色/地圖選擇視窗 -->
    <div id="start-modal" class="modal-overlay">
        <div class="modal-card">
            <h1 class="modal-title">末日倖存者：Roguelike 割草大戰</h1>
            
            <h3 style="margin-top: 15px; color: #00ffcc;">1. 選擇英雄</h3>
            <div class="cards-grid" id="hero-select-grid"></div>

            <h3 style="margin-top: 20px; color: #00ffcc;">2. 選擇寵物</h3>
            <div class="cards-grid" id="pet-select-grid"></div>

            <h3 style="margin-top: 20px; color: #00ffcc;">3. 選擇戰場</h3>
            <div class="cards-grid" id="map-select-grid"></div>

            <div style="margin-top: 25px; display: flex; justify-content: center; gap: 20px;">
                <button class="btn" onclick="openShopModal()">🛒 永久天賦商店</button>
                <button class="btn" style="background: linear-gradient(135deg, #00ffcc, #009966);" onclick="startGame()">⚔️ 出征開始遊戲</button>
            </div>
        </div>
    </div>

    <!-- 升級選擇技能視窗 -->
    <div id="levelup-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 class="modal-title">🎉 等級提升！選擇一項突破</h2>
            <div class="cards-grid" id="upgrade-cards-grid"></div>
        </div>
    </div>

    <!-- 寶箱視窗 -->
    <div id="chest-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card" style="max-width: 400px;">
            <h2 class="modal-title">🎁 獲得精英寶箱！</h2>
            <div id="chest-reward-icon" style="font-size: 60px; margin: 20px 0;">💰</div>
            <p id="chest-reward-text" style="font-size: 18px; color: #fff;"></p>
            <button class="btn" onclick="closeChestModal()">領取獎勵</button>
        </div>
    </div>

    <!-- 商店視窗 -->
    <div id="shop-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 class="modal-title">🛒 永久天賦強化商店</h2>
            <p style="margin-bottom: 15px; color: #ffd700;">持有金幣：<span id="shop-gold-text">0</span></p>
            <div id="shop-items-container"></div>
            <button class="btn" onclick="closeShopModal()">返回主選單</button>
        </div>
    </div>

    <!-- 結算視窗 -->
    <div id="gameover-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <h2 id="gameover-title" class="modal-title">戰鬥結束</h2>
            <p id="gameover-sub" style="margin-bottom: 15px;"></p>

            <h3 style="color: #00ffcc; text-align: left; margin-bottom: 10px;">📊 傷害輸出統計</h3>
            <div id="damage-stats-container" style="text-align: left; background: #111122; padding: 15px; border-radius: 8px;"></div>

            <button class="btn" onclick="resetToMenu()">返回主選單</button>
        </div>
    </div>

    <script>
        // --- 核心變數與 Canvas 設定 ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        const WORLD = { width: 3000, height: 3000 };
        const camera = { x: 0, y: 0 };

        // 遊戲狀態
        let isPaused = false;
        let isGameOver = false;
        let gameTime = 0;
        let score = 0;
        let sessionGold = 0;
        let totalGold = parseInt(localStorage.getItem("total_gold") || "0");
        let lastTime = 0;

        // 升級機制
        let level = 1;
        let xp = 0;
        let xpNext = 10;

        // 大招/衝刺
        let ultEnergy = 0;
        const MAX_ULT_ENERGY = 100;

        // 玩家基礎物件
        let player = {
            x: WORLD.width / 2,
            y: WORLD.height / 2,
            radius: 16,
            hp: 100, maxHp: 100,
            shield: 50, maxShield: 50, shieldRegen: 0.05,
            speed: 4, damage: 20, multiShot: 1, basePierce: 1,
            isEvolvedShot: false, pickupRadius: 120,
            orbitals: 0, orbitalAngle: 0,
            molotovLevel: 0, lightningLevel: 0,
            dashCooldown: 0, dashCooldownMax: 3.0, dashTimer: 0, isDashing: false, dashSpeedMult: 2.5,
            isInvincible: false, color: "#00ffcc"
        };

        // 鍵盤監聽
        const keys = {};
        window.addEventListener("keydown", (e) => {
            keys[e.code] = true;
            if (e.code === "KeyQ") triggerUlt();
            if (e.code === "ShiftLeft" || e.code === "ShiftRight") triggerDash();
        });
        window.addEventListener("keyup", (e) => { keys[e.code] = false; });

        // 遊戲實體陣列
        let zombies = [];
        let bullets = [];
        let enemyBullets = [];
        let drops = [];
        let quicksands = [];
        let obstacles = [];
        let firePools = [];
        let explosions = [];
        let petLasers = [];
        let lightningEffects = [];
        let trails = [];
        let floatingTexts = [];
        let thrownWeapons = [];

        // 射擊冷卻
        let SHOOT_INTERVAL = 15;
        let shootCooldown = 0;
        let molotovCooldown = 0;
        let lightningCooldown = 0;

        // BOSS 與目標
        let bossActive = false;
        let bossDefeated = false;
        let targetZombie = null;

        // 傷害統計
        let damageStats = { shoot: 0, explosion: 0, molotov: 0, lightning: 0, orbital: 0, pet: 0, ult: 0 };

        // 英雄資料
        const HEROES = {
            knight: { name: "裝甲騎士", color: "#00d2ff", hp: 150, speed: 3.6, damage: 25, desc: "血量極高，自帶額外護盾與強悍生存力。" },
            ranger: { name: "疾風獵手", color: "#00ffcc", hp: 90, speed: 4.8, damage: 18, desc: "移動迅速，擅長機動戰術與高速射擊。" },
            mage: { name: "秘法學者", color: "#cc66ff", hp: 80, speed: 3.8, damage: 30, desc: "初始傷害極高，容易觸發連鎖毀滅。" }
        };
        let selectedHero = "ranger";

        // 寵物資料
        const PETS = {
            none: { name: "無寵物", icon: "🚫", desc: "獨自作戰。" },
            robot: { name: "戰術機械球", icon: "🤖", action: "attack", damage: 15, cooldownMax: 1.5, desc: "自動雷射射擊最近敵人。" },
            dragon: { name: "小飛龍", icon: "🐉", action: "attack", damage: 30, cooldownMax: 2.5, desc: "噴發高傷害火球打擊目標。" },
            fairy: { name: "幸運精靈", icon: "🧚", action: "pickup", radius: 250, desc: "大幅擴大自動拾取寶石與金幣範圍。" }
        };
        let selectedPet = "robot";
        let petEntity = null;

        // 地圖資料
        const MAPS = {
            plains: { name: "平原小鎮", bg: "#1a2a1a", desc: "地勢平坦開闊，適合初學者練習。" },
            desert: { name: "死亡沙漠", bg: "#2d2415", desc: "分佈危險流沙陷阱，陷入會被嚴重減速。" },
            cave: { name: "幽暗洞窟", bg: "#181524", desc: "狹窄迷宮地形，充滿障礙巨石與狹道。" }
        };
        let currentMap = "plains";

        // 技能強化池
        const UPGRADES_POOL = [
            { id: "multishot", name: "多重射擊", icon: "🏹", desc: "主武器額外發射 1 發子彈" },
            { id: "damage", name: "威力強化", icon: "💥", desc: "提升 25% 基礎攻擊力" },
            { id: "pierce", name: "穿透彈藥", icon: "🎯", desc: "子彈穿透數量 +1" },
            { id: "orbitals", name: "護體法球", icon: "🔮", desc: "解鎖/增加一個環繞防禦法球" },
            { id: "molotov", name: "燃燒瓶", icon: "🔥", desc: "定期投擲造成範圍持續火焰傷害" },
            { id: "lightning", name: "閃電鏈", icon: "⚡", desc: "定期釋放連鎖閃電打擊多個敵人" },
            { id: "maxhp", name: "生命擴充", icon: "❤️", desc: "上限 +30 並立即恢復血量" },
            { id: "speed", name: "迅捷腳步", icon: "👟", desc: "移動速度增加 15%" },
            { id: "magnet", name: "磁鐵領域", icon: "🧲", desc: "大幅擴大拾取物品範圍" }
        ];

        // 永久商店購買項
        let shopUpgrades = JSON.parse(localStorage.getItem("shop_upgrades") || "{}");

        // --- 初始化 UI 菜單 ---
        function setupMenus() {
            // 英雄選擇
            const heroGrid = document.getElementById("hero-select-grid");
            heroGrid.innerHTML = "";
            for (let k in HEROES) {
                let h = HEROES[k];
                let card = document.createElement("div");
                card.className = `option-card ${selectedHero === k ? 'active' : ''}`;
                card.onclick = () => {
                    selectedHero = k;
                    setupMenus();
                };
                card.innerHTML = `<div class="option-name" style="color:${h.color}">${h.name}</div><div class="option-desc">${h.desc}</div>`;
                if (selectedHero === k) card.style.borderColor = "#00ffcc";
                heroGrid.appendChild(card);
            }

            // 寵物選擇
            const petGrid = document.getElementById("pet-select-grid");
            petGrid.innerHTML = "";
            for (let k in PETS) {
                let p = PETS[k];
                let card = document.createElement("div");
                card.className = "option-card";
                card.onclick = () => {
                    selectedPet = k;
                    setupMenus();
                };
                card.innerHTML = `<div class="option-icon">${p.icon}</div><div class="option-name">${p.name}</div><div class="option-desc">${p.desc}</div>`;
                if (selectedPet === k) card.style.borderColor = "#00ffcc";
                petGrid.appendChild(card);
            }

            // 地圖選擇
            const mapGrid = document.getElementById("map-select-grid");
            mapGrid.innerHTML = "";
            for (let k in MAPS) {
                let m = MAPS[k];
                let card = document.createElement("div");
                card.className = "option-card";
                card.onclick = () => {
                    currentMap = k;
                    setupMenus();
                };
                card.innerHTML = `<div class="option-name">${m.name}</div><div class="option-desc">${m.desc}</div>`;
                if (currentMap === k) card.style.borderColor = "#00ffcc";
                mapGrid.appendChild(card);
            }
        }

        // --- 地形生成 ---
        function initMapObjects() {
            quicksands = [];
            obstacles = [];
            if (currentMap === "desert") {
                for (let i = 0; i < 15; i++) {
                    quicksands.push({
                        x: Math.random() * (WORLD.width - 400) + 200,
                        y: Math.random() * (WORLD.height - 400) + 200,
                        radius: Math.random() * 80 + 60
                    });
                }
            } else if (currentMap === "cave") {
                for (let i = 0; i < 35; i++) {
                    obstacles.push({
                        x: Math.random() * (WORLD.width - 400) + 200,
                        y: Math.random() * (WORLD.height - 400) + 200,
                        radius: Math.random() * 40 + 30,
                        color: "#3a3254"
                    });
                }
            }
        }

        // 障礙物阻擋碰撞解算
        function resolveObstacles(entity) {
            for (let obs of obstacles) {
                let d = Math.hypot(entity.x - obs.x, entity.y - obs.y);
                let minDist = entity.radius + obs.radius;
                if (d < minDist) {
                    let overlap = minDist - d;
                    let nx = (entity.x - obs.x) / (d || 1);
                    let ny = (entity.y - obs.y) / (d || 1);
                    entity.x += nx * overlap;
                    entity.y += ny * overlap;
                }
            }
        }

        // --- 開始遊戲 ---
        function startGame() {
            document.getElementById("start-modal").style.display = "none";
            isPaused = false;
            isGameOver = false;

            // 應用永久商店加成
            let bonusHp = (shopUpgrades["hp"] || 0) * 20;
            let bonusDmg = (shopUpgrades["dmg"] || 0) * 5;
            let bonusSpd = (shopUpgrades["spd"] || 0) * 0.3;

            let h = HEROES[selectedHero];
            player = {
                x: WORLD.width / 2, y: WORLD.height / 2,
                radius: 16,
                hp: h.hp + bonusHp, maxHp: h.hp + bonusHp,
                shield: 50, maxShield: 50, shieldRegen: 0.05,
                speed: h.speed + bonusSpd, damage: h.damage + bonusDmg,
                multiShot: 1, basePierce: 1, isEvolvedShot: false,
                pickupRadius: 120, orbitals: 0, orbitalAngle: 0,
                molotovLevel: 0, lightningLevel: 0,
                dashCooldown: 0, dashCooldownMax: 3.0, dashTimer: 0, isDashing: false, dashSpeedMult: 2.5,
                isInvincible: false, color: h.color
            };

            // 寵物初始化
            if (selectedPet !== "none") {
                let p = PETS[selectedPet];
                petEntity = {
                    x: player.x, y: player.y, radius: 12,
                    action: p.action, damage: p.damage || 0,
                    cooldown: 0, cooldownMax: p.cooldownMax || 1,
                    floatAngle: 0, icon: p.icon
                };
                if (p.action === "pickup") player.pickupRadius += p.radius;
            } else {
                petEntity = null;
            }

            // 重置數據
            gameTime = 0; score = 0; sessionGold = 0; level = 1; xp = 0; xpNext = 10; ultEnergy = 0;
            zombies = []; bullets = []; enemyBullets = []; drops = []; firePools = []; explosions = [];
            petLasers = []; lightningEffects = []; trails = []; floatingTexts = []; thrownWeapons = [];
            bossActive = false; bossDefeated = false;
            damageStats = { shoot: 0, explosion: 0, molotov: 0, lightning: 0, orbital: 0, pet: 0, ult: 0 };

            initMapObjects();
            updateUI();
            updateUltUI();
            lastTime = performance.now();
        }

        // --- 技能發動機制 ---
        function triggerDash() {
            if (isPaused || isGameOver) return;
            if (player.dashCooldown <= 0 && !player.isDashing) {
                player.isDashing = true;
                player.dashTimer = 0.25;
                player.dashCooldown = player.dashCooldownMax;
                player.isInvincible = true;
            }
        }

        function triggerUlt() {
            if (isPaused || isGameOver) return;
            if (ultEnergy >= MAX_ULT_ENERGY) {
                ultEnergy = 0;
                updateUltUI();
                // 全螢幕光束清理
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
                    bullets.push({
                        x: player.x, y: player.y,
                        dx: Math.cos(a) * 15, dy: Math.sin(a) * 15,
                        radius: 12, color: "#ff0055",
                        damage: player.damage * 4, pierce: 99,
                        hitZombies: new Set(), isUlt: true
                    });
                }
            }
        }

        // --- 生成怪物機制 ---
        function spawnZombies() {
            if (bossActive) return;
            let count = Math.min(100, 5 + Math.floor(gameTime / 10));
            if (zombies.length < count) {
                let angle = Math.random() * Math.PI * 2;
                let dist = Math.random() * 400 + 500;
                let x = player.x + Math.cos(angle) * dist;
                let y = player.y + Math.sin(angle) * dist;

                let r = Math.random();
                let zType = "normal";
                let hp = 30 + gameTime * 0.8;
                let speed = 1.8 + Math.random() * 0.8;
                let color = "#33cc33";
                let radius = 14;

                if (r < 0.15) {
                    zType = "spitter"; hp = 25; color = "#9933ff"; radius = 13;
                } else if (r < 0.3) {
                    zType = "charger"; hp = 50; speed = 2.5; color = "#ff9900"; radius = 16;
                }

                let isElite = Math.random() < 0.05;
                if (isElite) {
                    hp *= 4; radius *= 1.4; color = "#ffd700";
                }

                zombies.push({
                    x: x, y: y, radius: radius,
                    hp: hp, maxHp: hp, speed: speed,
                    type: zType, color: color, isElite: isElite,
                    shootCooldown: 0, dashCooldown: 0, isDashing: false
                });
            }

            // BOSS 出現機制 (每 120 秒)
            if (gameTime > 0 && Math.floor(gameTime) % 120 === 0 && !bossActive && !bossDefeated) {
                spawnBoss();
            }
        }

        function spawnBoss() {
            bossActive = true;
            let angle = Math.random() * Math.PI * 2;
            let x = player.x + Math.cos(angle) * 400;
            let y = player.y + Math.sin(angle) * 400;
            zombies.push({
                x: x, y: y, radius: 45,
                hp: 3000, maxHp: 3000, speed: 1.2,
                type: "boss", color: "#ff0055", isBoss: true,
                bossSkillTimer: 0
            });
            document.getElementById("boss-hp-container").style.display = "block";
        }

        // --- 經驗值與升級機制 ---
        function gainXp(amount) {
            xp += amount;
            if (xp >= xpNext) {
                xp -= xpNext;
                level++;
                xpNext = Math.floor(xpNext * 1.3);
                showUpgradeModal();
            }
            updateUI();
        }

        function showUpgradeModal() {
            isPaused = true;
            const container = document.getElementById("upgrade-cards-grid");
            container.innerHTML = "";

            // 檢查超武合成條件 (例如：多重射擊 >= 3 時獲得火炮進化)
            let choices = [...UPGRADES_POOL];
            if (player.multiShot >= 3 && !player.isEvolvedShot) {
                choices.unshift({ id: "evolve_shot", name: "🔥 毀滅爆裂彈 (超武進化)", icon: "🚀", desc: "將子彈進化為帶有強烈範圍爆炸的核融合彈劑！" });
            }

            // 隨機抽取 3 項選項
            let shuffled = choices.sort(() => 0.5 - Math.random()).slice(0, 3);

            shuffled.forEach(upg => {
                let card = document.createElement("div");
                card.className = "option-card";
                card.onclick = () => selectUpgrade(upg.id);
                card.innerHTML = `<div class="option-icon">${upg.icon}</div><div class="option-name">${upg.name}</div><div class="option-desc">${upg.desc}</div>`;
                container.appendChild(card);
            });

            document.getElementById("levelup-modal").style.display = "flex";
        }

        function selectUpgrade(id) {
            if (id === "multishot") player.multiShot++;
            else if (id === "damage") player.damage *= 1.25;
            else if (id === "pierce") player.basePierce++;
            else if (id === "orbitals") player.orbitals++;
            else if (id === "molotov") player.molotovLevel++;
            else if (id === "lightning") player.lightningLevel++;
            else if (id === "maxhp") { player.maxHp += 30; player.hp = player.maxHp; }
            else if (id === "speed") player.speed *= 1.15;
            else if (id === "magnet") player.pickupRadius += 80;
            else if (id === "evolve_shot") player.isEvolvedShot = true;

            document.getElementById("levelup-modal").style.display = "none";
            isPaused = false;
        }

        // --- 寶箱機制 ---
        function openChestModal() {
            isPaused = true;
            let goldReward = Math.floor(Math.random() * 100 + 50);
            sessionGold += goldReward;
            document.getElementById("chest-reward-text").innerText = `開出大量物資！獎勵金幣 +${goldReward}`;
            document.getElementById("chest-modal").style.display = "flex";
        }

        function closeChestModal() {
            document.getElementById("chest-modal").style.display = "none";
            isPaused = false;
        }

        // --- UI 更新邏輯 ---
        function updateUI() {
            document.getElementById("hp-bar").style.width = `${Math.max(0, (player.hp / player.maxHp) * 100)}%`;
            document.getElementById("shield-bar").style.width = `${Math.max(0, (player.shield / player.maxShield) * 100)}%`;
            document.getElementById("xp-bar").style.width = `${Math.min(100, (xp / xpNext) * 100)}%`;
            document.getElementById("level-text").innerText = level;
            document.getElementById("score-text").innerText = score;
            document.getElementById("gold-text").innerText = sessionGold;

            let mins = Math.floor(gameTime / 60).toString().padStart(2, '0');
            let secs = Math.floor(gameTime % 60).toString().padStart(2, '0');
            document.getElementById("time-text").innerText = `${mins}:${secs}`;
        }

        function updateUltUI() {
            let pct = Math.min(100, (ultEnergy / MAX_ULT_ENERGY) * 100);
            document.getElementById("ult-bar").style.width = `${pct}%`;
            document.getElementById("ult-text").innerText = pct >= 100 ? "必殺技就緒 [Q]" : "蓄力中 [Q]";
        }

        function spawnDamageText(x, y, amount) {
            floatingTexts.push({
                x: x, y: y,
                text: Math.round(amount),
                color: amount > 40 ? "#ffaa00" : "#ffffff",
                size: amount > 40 ? 20 : 14,
                life: 30
            });
        }

        // --- 永久天賦商店 ---
        function openShopModal() {
            document.getElementById("shop-gold-text").innerText = totalGold;
            const container = document.getElementById("shop-items-container");
            container.innerHTML = "";

            const items = [
                { id: "hp", name: "生命強化", cost: 200, desc: "每級增加 +20 戰鬥初始血量" },
                { id: "dmg", name: "攻擊特化", cost: 300, desc: "每級增加 +5 基礎攻擊力" },
                { id: "spd", name: "機動升級", cost: 250, desc: "每級增加 +0.3 基礎移動速度" }
            ];

            items.forEach(it => {
                let lvl = shopUpgrades[it.id] || 0;
                let cost = it.cost * (lvl + 1);
                let div = document.createElement("div");
                div.className = "shop-item";
                div.innerHTML = `
                    <div>
                        <div style="font-weight:bold;">${it.name} (Lv.${lvl})</div>
                        <div style="font-size:12px; color:#aaa;">${it.desc}</div>
                    </div>
                    <button class="btn" style="margin:0; padding:6px 15px; font-size:14px;" onclick="buyShopItem('${it.id}', ${cost})">
                        升級 (${cost} 金幣)
                    </button>
                `;
                container.appendChild(div);
            });

            document.getElementById("shop-modal").style.display = "flex";
        }

        function buyShopItem(id, cost) {
            if (totalGold >= cost) {
                totalGold -= cost;
                shopUpgrades[id] = (shopUpgrades[id] || 0) + 1;
                localStorage.setItem("total_gold", totalGold);
                localStorage.setItem("shop_upgrades", JSON.stringify(shopUpgrades));
                openShopModal();
            } else {
                alert("金幣不足！");
            }
        }

        function closeShopModal() {
            document.getElementById("shop-modal").style.display = "none";
        }

        // --- 遊戲結束結算 ---
        function endGame(victory) {
            isGameOver = true;
            totalGold += sessionGold;
            localStorage.setItem("total_gold", totalGold);

            document.getElementById("gameover-title").innerText = victory ? "🏆 勝利！擊退領主" : "💀 戰鬥失敗";
            document.getElementById("gameover-title").style.color = victory ? "#00ffcc" : "#ff0055";
            document.getElementById("gameover-sub").innerText = `存活時間：${Math.floor(gameTime)}秒 | 擊殺數：${score} | 獲得金幣：${sessionGold}`;

            // 輸出傷害圖表
            const statsContainer = document.getElementById("damage-stats-container");
            statsContainer.innerHTML = "";
            let totalDmg = Object.values(damageStats).reduce((a, b) => a + b, 0) || 1;

            const nameMap = { shoot: "主武器射擊", explosion: "爆裂彈頭", molotov: "燃術火藥", lightning: "連鎖閃電", orbital: "護體法球", pet: "戰寵輸出", ult: "必殺絕招" };

            for (let k in damageStats) {
                let val = Math.round(damageStats[k]);
                let pct = Math.round((val / totalDmg) * 100);
                if (val > 0) {
                    statsContainer.innerHTML += `
                        <div class="stat-row">
                            <span style="width:90px;">${nameMap[k]}</span>
                            <div class="stat-bar-bg"><div class="stat-bar-val" style="width:${pct}%"></div></div>
                            <span style="width:100px; text-align:right;">${val} (${pct}%)</span>
                        </div>
                    `;
                }
            }

            document.getElementById("gameover-modal").style.display = "flex";
        }

        function resetToMenu() {
            document.getElementById("gameover-modal").style.display = "none";
            document.getElementById("start-modal").style.display = "flex";
            document.getElementById("boss-hp-container").style.display = "none";
            setupMenus();
        }

        // --- 核心物理與主遊戲邏輯 ---
        function update(dt) {
            if (isPaused || isGameOver) return;

            gameTime += dt;
            updateUI();
            spawnZombies();

            // 地形影響
            let playerSpeedMult = 1.0;
            if (currentMap === "desert") {
                for (let q of quicksands) {
                    if (Math.hypot(player.x - q.x, player.y - q.y) < q.radius) {
                        playerSpeedMult = 0.5;
                        break;
                    }
                }
            }

            // 玩家方向操控
            let dx = 0, dy = 0;
            if (keys["KeyW"] || keys["ArrowUp"]) dy -= 1;
            if (keys["KeyS"] || keys["ArrowDown"]) dy += 1;
            if (keys["KeyA"] || keys["ArrowLeft"]) dx -= 1;
            if (keys["KeyD"] || keys["ArrowRight"]) dx += 1;

            if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

            let moveSpeed = player.speed * playerSpeedMult;

            // 衝刺狀態更新
            if (player.isDashing) {
                player.dashTimer -= dt;
                moveSpeed *= player.dashSpeedMult;
                if (Math.random() < 0.6) {
                    trails.push({ x: player.x, y: player.y, radius: player.radius, alpha: 0.5, color: player.color });
                }
                if (player.dashTimer <= 0) {
                    player.isDashing = false;
                    player.isInvincible = false;
                }
            }

            if (player.dashCooldown > 0) {
                player.dashCooldown -= dt;
                let pct = Math.max(0, (1 - player.dashCooldown / player.dashCooldownMax) * 100);
                document.getElementById("dash-bar").style.width = `${pct}%`;
                document.getElementById("dash-text").innerText = player.dashCooldown <= 0 ? "衝刺就緒 [Shift]" : `冷卻中 (${player.dashCooldown.toFixed(1)}s)`;
            }

            player.x += dx * moveSpeed;
            player.y += dy * moveSpeed;

            // 世界邊界限制
            player.x = Math.max(player.radius, Math.min(WORLD.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(WORLD.height - player.radius, player.y));

            resolveObstacles(player);

            // 護盾自動回復
            if (player.maxShield > 0 && player.shield < player.maxShield) {
                player.shield = Math.min(player.maxShield, player.shield + player.shieldRegen);
            }

            // 戰寵跟隨與 AI
            if (petEntity) {
                petEntity.floatAngle += 0.05;
                let targetPetX = player.x + Math.cos(petEntity.floatAngle) * 45;
                let targetPetY = player.y + Math.sin(petEntity.floatAngle) * 45 - 20;
                petEntity.x += (targetPetX - petEntity.x) * 0.1;
                petEntity.y += (targetPetY - petEntity.y) * 0.1;

                if (petEntity.action === 'attack') {
                    petEntity.cooldown -= dt;
                    if (petEntity.cooldown <= 0 && zombies.length > 0) {
                        let nearest = null;
                        let minDist = 400;
                        for (let z of zombies) {
                            let d = Math.hypot(z.x - petEntity.x, z.y - petEntity.y);
                            if (d < minDist) { minDist = d; nearest = z; }
                        }
                        if (nearest) {
                            petEntity.cooldown = petEntity.cooldownMax;
                            nearest.hp -= petEntity.damage;
                            spawnDamageText(nearest.x, nearest.y, petEntity.damage);
                            damageStats.pet += petEntity.damage;
                            petLasers.push({ x1: petEntity.x, y1: petEntity.y, x2: nearest.x, y2: nearest.y, life: 10 });
                        }
                    }
                }
            }

            // 環繞法球
            if (player.orbitals > 0) {
                player.orbitalAngle += 0.04;
                let orbitalRadius = 70;
                let orbitalDmg = player.damage * 0.8;
                for (let i = 0; i < player.orbitals; i++) {
                    let angle = player.orbitalAngle + (i * Math.PI * 2 / player.orbitals);
                    let ox = player.x + Math.cos(angle) * orbitalRadius;
                    let oy = player.y + Math.sin(angle) * orbitalRadius;

                    for (let z of zombies) {
                        if (Math.hypot(z.x - ox, z.y - oy) < z.radius + 10) {
                            z.hp -= orbitalDmg * 0.2;
                            damageStats.orbital += orbitalDmg * 0.2;
                        }
                    }
                }
            }

            // 自動瞄準最近的敵人
            targetZombie = null;
            let closestDist = Infinity;
            for (let z of zombies) {
                let d = Math.hypot(z.x - player.x, z.y - player.y);
                if (d < closestDist) { closestDist = d; targetZombie = z; }
            }

            // 武器射擊
            shootCooldown -= 1;
            if (shootCooldown <= 0 && targetZombie) {
                shootCooldown = SHOOT_INTERVAL;
                let baseAngle = Math.atan2(targetZombie.y - player.y, targetZombie.x - player.x);
                let spread = 0.15;
                let count = player.multiShot;
                let startAngle = baseAngle - (spread * (count - 1)) / 2;

                for (let i = 0; i < count; i++) {
                    let angle = startAngle + i * spread;
                    bullets.push({
                        x: player.x, y: player.y,
                        dx: Math.cos(angle) * 10, dy: Math.sin(angle) * 10,
                        radius: player.isEvolvedShot ? 7 : 5,
                        color: player.isEvolvedShot ? "#ff5500" : "#ffff00",
                        damage: player.damage,
                        pierce: player.basePierce,
                        hitZombies: new Set(),
                        isEvolved: player.isEvolvedShot
                    });
                }
            }

            // 主動技能：燃燒瓶
            if (player.molotovLevel > 0) {
                molotovCooldown -= 1;
                if (molotovCooldown <= 0) {
                    molotovCooldown = Math.max(60, 180 - player.molotovLevel * 20);
                    let targetX = player.x + (Math.random() - 0.5) * 300;
                    let targetY = player.y + (Math.random() - 0.5) * 300;
                    if (targetZombie) { targetX = targetZombie.x; targetY = targetZombie.y; }
                    thrownWeapons.push({ x: player.x, y: player.y, targetX: targetX, targetY: targetY, speed: 8, radius: 6 });
                }
            }

            // 投擲物移動更新
            for (let i = thrownWeapons.length - 1; i >= 0; i--) {
                let tw = thrownWeapons[i];
                let dist = Math.hypot(tw.targetX - tw.x, tw.targetY - tw.y);
                if (dist < 10) {
                    firePools.push({ x: tw.targetX, y: tw.targetY, radius: 50 + player.molotovLevel * 10, duration: 180, damage: 0.5 + player.molotovLevel * 0.3 });
                    thrownWeapons.splice(i, 1);
                } else {
                    let angle = Math.atan2(tw.targetY - tw.y, tw.targetX - tw.x);
                    tw.x += Math.cos(angle) * tw.speed;
                    tw.y += Math.sin(angle) * tw.speed;
                }
            }

            // 火圈傷害邏輯
            for (let i = firePools.length - 1; i >= 0; i--) {
                let fp = firePools[i];
                fp.duration -= 1;
                for (let z of zombies) {
                    if (Math.hypot(z.x - fp.x, z.y - fp.y) < fp.radius) {
                        z.hp -= fp.damage;
                        damageStats.molotov += fp.damage;
                    }
                }
                if (fp.duration <= 0) firePools.splice(i, 1);
            }

            // 主動技能：閃電鏈
            if (player.lightningLevel > 0) {
                lightningCooldown -= 1;
                if (lightningCooldown <= 0 && zombies.length > 0) {
                    lightningCooldown = Math.max(40, 150 - player.lightningLevel * 20);
                    let targets = [...zombies].sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y)).slice(0, 1 + player.lightningLevel);
                    let chain = [player, ...targets];
                    for (let c = 1; c < chain.length; c++) {
                        let target = chain[c];
                        let dmg = player.damage * (1.5 + player.lightningLevel * 0.5);
                        target.hp -= dmg;
                        spawnDamageText(target.x, target.y, dmg);
                        damageStats.lightning += dmg;
                        lightningEffects.push({ x1: chain[c-1].x, y1: chain[c-1].y, x2: target.x, y2: target.y, life: 12 });
                    }
                }
            }

            // 子彈物理與碰撞
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += b.dx;
                b.y += b.dy;

                if (b.x < 0 || b.x > WORLD.width || b.y < 0 || b.y > WORLD.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let z of zombies) {
                    if (!b.hitZombies.has(z) && Math.hypot(z.x - b.x, z.y - b.y) < z.radius + b.radius) {
                        b.hitZombies.add(z);
                        z.hp -= b.damage;
                        spawnDamageText(z.x, z.y, b.damage);

                        if (b.isUlt) damageStats.ult += b.damage;
                        else if (b.isEvolved) damageStats.explosion += b.damage;
                        else damageStats.shoot += b.damage;

                        if (b.isEvolved) {
                            explosions.push({ x: b.x, y: b.y, radius: 60, life: 15 });
                            for (let oz of zombies) {
                                if (Math.hypot(oz.x - b.x, oz.y - b.y) < 60) {
                                    oz.hp -= b.damage * 0.8;
                                    damageStats.explosion += b.damage * 0.8;
                                }
                            }
                        }

                        if (ultEnergy < MAX_ULT_ENERGY) {
                            ultEnergy = Math.min(MAX_ULT_ENERGY, ultEnergy + 0.5);
                            updateUltUI();
                        }

                        b.pierce--;
                        if (b.pierce <= 0) {
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // 爆炸視覺特效
            for (let i = explosions.length - 1; i >= 0; i--) {
                let exp = explosions[i];
                exp.life -= 1;
                if (exp.life <= 0) explosions.splice(i, 1);
            }

            // 殭屍 AI 與血量更新
            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];

                if (z.hp <= 0) {
                    score++;
                    sessionGold += z.isBoss ? 500 : (z.isElite ? 50 : 1);
                    if (z.isBoss) {
                        bossActive = false;
                        bossDefeated = true;
                        endGame(true);
                        return;
                    }

                    // 掉落物生成
                    if (z.isElite) {
                        drops.push({ x: z.x, y: z.y, radius: 16, type: "chest" });
                    } else {
                        let xpVal = z.type === "charger" ? 3 : (z.type === "spitter" ? 2 : 1);
                        drops.push({ x: z.x, y: z.y, radius: 8, type: "gem", value: xpVal });
                    }

                    zombies.splice(i, 1);
                    continue;
                }

                let angle = Math.atan2(player.y - z.y, player.x - z.x);

                if (z.type === "boss") {
                    document.getElementById("boss-hp-bar").style.width = `${Math.max(0, (z.hp / z.maxHp) * 100)}%`;
                    z.bossSkillTimer -= dt;
                    if (z.bossSkillTimer <= 0) {
                        z.bossSkillTimer = 4.0;
                        for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
                            enemyBullets.push({ x: z.x, y: z.y, dx: Math.cos(a) * 4, dy: Math.sin(a) * 4, radius: 8, color: "#ff8800", damage: 15 });
                        }
                    }
                    z.x += Math.cos(angle) * z.speed;
                    z.y += Math.sin(angle) * z.speed;
                } else if (z.type === "spitter") {
                    let distToPlayer = Math.hypot(player.x - z.x, player.y - z.y);
                    if (distToPlayer > 200) {
                        z.x += Math.cos(angle) * z.speed;
                        z.y += Math.sin(angle) * z.speed;
                    }
                    z.shootCooldown -= dt;
                    if (z.shootCooldown <= 0) {
                        z.shootCooldown = 2.5;
                        enemyBullets.push({ x: z.x, y: z.y, dx: Math.cos(angle) * 5, dy: Math.sin(angle) * 5, radius: 6, color: "#00ff66", damage: 8 });
                    }
                } else if (z.type === "charger") {
                    let distToPlayer = Math.hypot(player.x - z.x, player.y - z.y);
                    if (!z.isDashing && distToPlayer < 180 && z.dashCooldown <= 0) {
                        z.isDashing = true;
                        z.dashTimer = 0.5;
                        z.dashDx = Math.cos(angle) * z.speed * 3.5;
                        z.dashDy = Math.sin(angle) * z.speed * 3.5;
                    }

                    if (z.isDashing) {
                        z.x += z.dashDx;
                        z.y += z.dashDy;
                        z.dashTimer -= dt;
                        if (z.dashTimer <= 0) {
                            z.isDashing = false;
                            z.dashCooldown = 3.0;
                        }
                    } else {
                        if (z.dashCooldown > 0) z.dashCooldown -= dt;
                        z.x += Math.cos(angle) * z.speed;
                        z.y += Math.sin(angle) * z.speed;
                    }
                } else {
                    z.x += Math.cos(angle) * z.speed;
                    z.y += Math.sin(angle) * z.speed;
                }

                resolveObstacles(z);

                // 玩家受傷判定
                if (!player.isInvincible && Math.hypot(player.x - z.x, player.y - z.y) < player.radius + z.radius) {
                    let dmg = z.isBoss ? 25 : (z.isElite ? 15 : 8);
                    if (player.shield > 0) {
                        player.shield -= dmg;
                        if (player.shield < 0) { player.hp += player.shield; player.shield = 0; }
                    } else {
                        player.hp -= dmg;
                    }
                    updateUI();
                    if (player.hp <= 0) {
                        endGame(false);
                        return;
                    }
                }
            }

            // 敵方子彈移動與傷害
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += eb.dx;
                eb.y += eb.dy;

                if (eb.x < 0 || eb.x > WORLD.width || eb.y < 0 || eb.y > WORLD.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                if (!player.isInvincible && Math.hypot(player.x - eb.x, player.y - eb.y) < player.radius + eb.radius) {
                    if (player.shield > 0) {
                        player.shield -= eb.damage;
                        if (player.shield < 0) { player.hp += player.shield; player.shield = 0; }
                    } else {
                        player.hp -= eb.damage;
                    }
                    updateUI();
                    enemyBullets.splice(i, 1);
                    if (player.hp <= 0) {
                        endGame(false);
                        return;
                    }
                }
            }

            // 掉落物磁鐵吸引與拾取
            let effectiveRadius = player.pickupRadius + (petEntity ? petEntity.radius : 0);
            for (let i = drops.length - 1; i >= 0; i--) {
                let d = drops[i];
                let dist = Math.hypot(player.x - d.x, player.y - d.y);

                if (dist < effectiveRadius) {
                    let angle = Math.atan2(player.y - d.y, player.x - d.x);
                    d.x += Math.cos(angle) * 8;
                    d.y += Math.sin(angle) * 8;
                }

                if (dist < player.radius + d.radius) {
                    if (d.type === "gem") {
                        gainXp(d.value);
                    } else if (d.type === "chest") {
                        openChestModal();
                    }
                    drops.splice(i, 1);
                }
            }

            // 特效生命週期清理
            for (let i = petLasers.length - 1; i >= 0; i--) {
                petLasers[i].life -= 1;
                if (petLasers[i].life <= 0) petLasers.splice(i, 1);
            }
            for (let i = lightningEffects.length - 1; i >= 0; i--) {
                lightningEffects[i].life -= 1;
                if (lightningEffects[i].life <= 0) lightningEffects.splice(i, 1);
            }
            for (let i = trails.length - 1; i >= 0; i--) {
                trails[i].alpha -= 0.05;
                if (trails[i].alpha <= 0) trails.splice(i, 1);
            }
            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                floatingTexts[i].y -= 0.5;
                floatingTexts[i].life -= 1;
                if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
            }
        }

        // --- 畫面繪製邏輯 ---
        function draw() {
            camera.x = Math.max(0, Math.min(WORLD.width - canvas.width, player.x - canvas.width / 2));
            camera.y = Math.max(0, Math.min(WORLD.height - canvas.height, player.y - canvas.height / 2));

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.translate(-camera.x, -camera.y);

            // 地圖背景繪製
            let bgColors = { plains: "#1a2a1a", desert: "#2d2415", cave: "#181524" };
            ctx.fillStyle = bgColors[currentMap] || "#1a1a1a";
            ctx.fillRect(0, 0, WORLD.width, WORLD.height);

            // 網格背景
            ctx.strokeStyle = "rgba(255,255,255,0.04)";
            ctx.lineWidth = 1;
            for (let x = 0; x < WORLD.width; x += 80) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.height); ctx.stroke();
            }
            for (let y = 0; y < WORLD.height; y += 80) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.width, y); ctx.stroke();
            }

            // 流沙區域
            for (let q of quicksands) {
                ctx.fillStyle = "rgba(180, 140, 60, 0.3)";
                ctx.beginPath(); ctx.arc(q.x, q.y, q.radius, 0, Math.PI * 2); ctx.fill();
            }

            // 燃燒火圈
            for (let fp of firePools) {
                ctx.fillStyle = "rgba(255, 60, 0, 0.4)";
                ctx.beginPath(); ctx.arc(fp.x, fp.y, fp.radius, 0, Math.PI * 2); ctx.fill();
            }

            // 障礙物
            for (let obs of obstacles) {
                ctx.fillStyle = obs.color;
                ctx.beginPath(); ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "rgba(255,255,255,0.1)"; ctx.stroke();
            }

            // 掉落物
            for (let d of drops) {
                if (d.type === "gem") {
                    ctx.fillStyle = "#00ffff";
                    ctx.beginPath(); ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2); ctx.fill();
                } else if (d.type === "chest") {
                    ctx.fillStyle = "#ffd700";
                    ctx.fillRect(d.x - 12, d.y - 10, 24, 20);
                }
            }

            // 投擲武器
            for (let tw of thrownWeapons) {
                ctx.fillStyle = "#ff5500";
                ctx.beginPath(); ctx.arc(tw.x, tw.y, tw.radius, 0, Math.PI * 2); ctx.fill();
            }

            // 殭屍
            for (let z of zombies) {
                ctx.fillStyle = z.color;
                ctx.beginPath(); ctx.arc(z.x, z.y, z.radius, 0, Math.PI * 2); ctx.fill();
                if (z.isElite || z.isBoss) {
                    ctx.strokeStyle = z.isBoss ? "#ff0055" : "#ffd700";
                    ctx.lineWidth = 3; ctx.stroke();
                }
            }

            // 衝刺殘影
            for (let t of trails) {
                ctx.fillStyle = `rgba(0, 170, 255, ${t.alpha})`;
                ctx.beginPath(); ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2); ctx.fill();
            }

            // 玩家角色
            ctx.fillStyle = player.isInvincible ? "#ffffff" : player.color;
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();

            // 護盾光環
            if (player.shield > 0) {
                ctx.strokeStyle = "rgba(0, 255, 255, 0.7)";
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 6, 0, Math.PI * 2); ctx.stroke();
            }

            // 環繞法球繪製
            if (player.orbitals > 0) {
                let orbitalRadius = 70;
                for (let i = 0; i < player.orbitals; i++) {
                    let angle = player.orbitalAngle + (i * Math.PI * 2 / player.orbitals);
                    let ox = player.x + Math.cos(angle) * orbitalRadius;
                    let oy = player.y + Math.sin(angle) * orbitalRadius;
                    ctx.fillStyle = "#00ffff";
                    ctx.beginPath(); ctx.arc(ox, oy, 8, 0, Math.PI * 2); ctx.fill();
                }
            }

            // 戰寵繪製
            if (petEntity) {
                ctx.font = "20px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(petEntity.icon, petEntity.x, petEntity.y);
            }

            // 我方子彈
            for (let b of bullets) {
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
            }

            // 敵方子彈
            for (let eb of enemyBullets) {
                ctx.fillStyle = eb.color;
                ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.radius, 0, Math.PI * 2); ctx.fill();
            }

            // 爆炸範圍
            for (let exp of explosions) {
                ctx.fillStyle = "rgba(255, 85, 0, 0.5)";
                ctx.beginPath(); ctx.arc(exp.x, exp.y, exp.radius, 0, Math.PI * 2); ctx.fill();
            }

            // 戰寵雷射
            ctx.strokeStyle = "#ff00ff";
            ctx.lineWidth = 2;
            for (let l of petLasers) {
                ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
            }

            // 閃電特效
            ctx.strokeStyle = "#00ffff";
            ctx.lineWidth = 3;
            for (let l of lightningEffects) {
                ctx.beginPath(); ctx.moveTo(l.x1, l.y1); ctx.lineTo(l.x2, l.y2); ctx.stroke();
            }

            // 傷害浮動文字
            ctx.textAlign = "center";
            for (let t of floatingTexts) {
                ctx.font = `bold ${t.size}px sans-serif`;
                ctx.fillStyle = t.color;
                ctx.fillText(t.text, t.x, t.y);
            }

            ctx.restore();
        }

        // --- 主遊戲迴圈 ---
        function gameLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            if (isNaN(dt) || dt > 0.1) dt = 0.016;
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        // 啟動首頁 UI 與畫面迴圈
        setupMenus();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
