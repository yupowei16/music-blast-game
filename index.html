
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    >
    <title>殭屍生存：極速升級</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="ui-container">
        <div class="stat-box" id="status">
            關卡：1/50<br>
            LV：1 | 血量：100/100 | 擊殺：0 | 金幣：<span class="gold-text">0</span>
        </div>

        <div class="right-bars">
            <div id="dash-container" class="meter">
                <div id="dash-bar" class="meter-fill"></div>
                <div id="dash-text" class="meter-text">衝刺就緒 [Shift]</div>
            </div>

            <div id="ult-container" class="meter">
                <div id="ult-bar" class="meter-fill"></div>
                <div id="ult-text" class="meter-text">終極技能充能 0%</div>
            </div>
        </div>
    </header>

    <div id="xp-container">
        <div id="xp-bar"></div>
    </div>

    <main id="game-wrapper">
        <canvas id="gameCanvas" width="960" height="540"></canvas>

        <div id="stage-label">
            <span id="stage-number">第 1 關</span>
            <span id="stage-goal">擊敗敵人：0/8</span>
        </div>

        <div id="boss-hp-container">
            <div id="boss-hp-bar"></div>
            <div id="boss-hp-text">憤怒的卡比</div>
        </div>

        <div id="weapon-panel">
            <span>武器：</span>
            <strong id="weapon-name">手槍</strong>
            <span id="weapon-detail">普通射擊</span>
        </div>

        <div id="explosive-cooldown">
            <span id="explosive-cooldown-text">爆裂彈就緒 [Q]</span>
            <div class="mini-meter">
                <div id="explosive-cooldown-bar"></div>
            </div>
        </div>

        <section id="main-menu" class="modal visible">
            <div class="modal-panel main-menu-panel">
                <h1 class="game-title">無盡屍海</h1>
                <p class="game-desc">
                    選擇角色後進入 50 關生存挑戰。<br>
                    電腦：WASD／方向鍵移動、Shift 衝刺、空白鍵終極技能、Q 霰彈槍。<br>
                    手機：使用畫面下方的觸控按鈕移動與施放技能。
                </p>
                <button class="action-btn" id="start-btn">開始生存</button>
                <button class="action-btn secondary" id="achievement-btn">🏆 成就任務</button>
            </div>
        </section>

        <section id="character-select-modal" class="modal">
            <div class="modal-panel character-panel">
                <h1>選擇角色</h1>
                <p>選擇角色後開始第 1 關。</p>

                <div class="character-cards">
                    <button class="character-card" data-character="miku">
                        <img src="images/3654-removebg-preview.jpg" alt="初音未來">
                        <span>初音未來</span>
                        <small>平衡型生存者</small>
                    </button>

                    <button class="character-card" data-character="kanade">
                        <img src="images/3655-removebg-preview.jpg" alt="宵崎奏">
                        <span>宵崎奏</span>
                        <small>專注型生存者</small>
                    </button>
                </div>

                <button class="action-btn secondary" id="back-main-btn">返回</button>
            </div>
        </section>

        <section id="level-up-modal" class="modal">
            <div class="modal-panel">
                <h1 class="cyan-title">升級了！選擇技能</h1>
                <div id="skill-choices" class="skill-choices"></div>
            </div>
        </section>

        <section id="stage-reward-modal" class="modal">
            <div class="modal-panel reward-panel">
                <h1>🏆 關卡完成！</h1>
                <p id="stage-reward-title">第 1 關通關</p>
                <p id="stage-reward-text"></p>
                <button class="action-btn" id="next-stage-btn">進入下一關</button>
            </div>
        </section>

        <section id="achievement-modal" class="modal">
            <div class="modal-panel achievement-panel">
                <h1>🏆 成就任務</h1>
                <div id="achievement-list"></div>
                <button class="action-btn secondary" id="close-achievement-btn">返回</button>
            </div>
        </section>

        <section id="pause-modal" class="modal">
            <div class="modal-panel">
                <h1>⏸ 遊戲暫停</h1>
                <p id="pause-info"></p>
                <button class="action-btn" id="resume-btn">繼續遊戲</button>
                <button class="action-btn secondary" id="restart-btn">重新開始</button>
            </div>
        </section>

        <section id="end-modal" class="modal">
            <div class="modal-panel">
                <h1 id="end-title"></h1>
                <p id="end-stats"></p>
                <button class="action-btn" id="restart-end-btn">重新開始</button>
            </div>
        </section>

        <section id="mobile-controls" aria-label="手機遊戲控制">
            <div class="move-controls">
                <button class="mobile-btn up" data-key="up">▲</button>
                <button class="mobile-btn left" data-key="left">◀</button>
                <button class="mobile-btn down" data-key="down">▼</button>
                <button class="mobile-btn right" data-key="right">▶</button>
            </div>

            <div class="action-controls">
                <button class="mobile-btn action attack" id="mobile-attack-btn">射擊</button>
                <button class="mobile-btn action shotgun" id="mobile-shotgun-btn">霰彈</button>
                <button class="mobile-btn action ultimate" id="mobile-ultimate-btn">大招</button>
                <button class="mobile-btn action dash" id="mobile-dash-btn">衝刺</button>
            </div>
        </section>
    </main>

    <script src="game.js"></script>
</body>
</html>
